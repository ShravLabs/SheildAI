<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShieldAI — Cloud Security Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #04070F;
    --bg1:       #080D1A;
    --bg2:       #0C1526;
    --bg3:       #101D33;
    --border:    #1A2D50;
    --border2:   #243A62;
    --cyan:      #00E5FF;
    --cyan-dim:  #00E5FF30;
    --teal:      #00BFA5;
    --green:     #00E676;
    --red:       #FF1744;
    --orange:    #FF6D00;
    --yellow:    #FFD600;
    --muted:     #4A6080;
    --text:      #C8D8F0;
    --text2:     #8099BF;
    --white:     #FFFFFF;
    --mono:      'Space Mono', monospace;
    --sans:      'DM Sans', sans-serif;
    --glow-cyan: 0 0 20px #00E5FF40, 0 0 40px #00E5FF20;
    --glow-red:  0 0 20px #FF174440, 0 0 40px #FF174420;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% -10%, #00E5FF0A 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Layout ─────────────────────────────── */
  #root { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

  .header {
    display: flex; align-items: center; gap: 20px;
    padding: 0 32px; height: 64px;
    background: var(--bg1);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--mono); font-size: 18px; font-weight: 700;
    color: var(--cyan); letter-spacing: 2px;
    text-shadow: var(--glow-cyan);
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--cyan), var(--teal));
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex; align-items: center; justify-content: center;
    animation: hexPulse 3s ease-in-out infinite;
  }

  @keyframes hexPulse {
    0%,100% { box-shadow: 0 0 0 0 #00E5FF40; }
    50% { box-shadow: 0 0 0 8px #00E5FF00; }
  }

  .header-divider { width: 1px; height: 24px; background: var(--border); }

  .header-subtitle {
    font-size: 12px; color: var(--text2); letter-spacing: 1px;
    text-transform: uppercase; font-family: var(--mono);
  }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  .live-badge {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
    color: var(--green); padding: 4px 12px;
    border: 1px solid var(--green); border-radius: 4px;
    background: #00E67610;
  }

  .live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .sim-btn {
    font-family: var(--mono); font-size: 12px; letter-spacing: 1px;
    padding: 7px 20px; border-radius: 4px; cursor: pointer;
    border: 1px solid; transition: all 0.2s;
    text-transform: uppercase; font-weight: 700;
  }
  .sim-btn.start { background: var(--cyan-dim); color: var(--cyan); border-color: var(--cyan); }
  .sim-btn.start:hover { background: #00E5FF25; box-shadow: var(--glow-cyan); }
  .sim-btn.stop { background: #FF174420; color: var(--red); border-color: var(--red); }
  .sim-btn.stop:hover { background: #FF174430; box-shadow: var(--glow-red); }

  /* ── Main grid ───────────────────────────── */
  .main { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: auto 1fr; gap: 0; flex: 1; }

  /* ── Sidebar ─────────────────────────────── */
  .sidebar {
    grid-row: 1 / 3;
    background: var(--bg1);
    border-right: 1px solid var(--border);
    padding: 24px 0;
    display: flex; flex-direction: column; gap: 0;
  }

  .sidebar-section { padding: 0 20px 24px; }
  .sidebar-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 12px;
    padding: 0 4px;
  }

  .stat-block {
    padding: 16px; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 8px; position: relative; overflow: hidden;
    transition: border-color 0.2s;
  }
  .stat-block::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    border-radius: 8px 0 0 8px;
  }
  .stat-block.cyan::before { background: var(--cyan); }
  .stat-block.green::before { background: var(--green); }
  .stat-block.red::before { background: var(--red); }
  .stat-block.orange::before { background: var(--orange); }
  .stat-block.yellow::before { background: var(--yellow); }

  .stat-label { font-size: 11px; color: var(--text2); font-family: var(--mono); letter-spacing: 0.5px; }
  .stat-value { font-size: 30px; font-weight: 700; font-family: var(--mono); margin: 4px 0 2px; line-height: 1; }
  .stat-value.cyan { color: var(--cyan); text-shadow: 0 0 20px #00E5FF50; }
  .stat-value.green { color: var(--green); text-shadow: 0 0 20px #00E67650; }
  .stat-value.red { color: var(--red); text-shadow: 0 0 20px #FF174450; }
  .stat-value.orange { color: var(--orange); }
  .stat-value.yellow { color: var(--yellow); }
  .stat-sub { font-size: 10px; color: var(--muted); }

  .dist-bar { margin-top: 12px; }
  .dist-bar-track {
    height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden;
    display: flex; gap: 2px; margin-bottom: 8px;
  }
  .dist-segment { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
  .dist-legend { display: flex; flex-direction: column; gap: 5px; }
  .dist-row { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .dist-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .dist-name { color: var(--text2); font-family: var(--mono); flex: 1; font-size: 10px; letter-spacing: 0.5px; }
  .dist-count { color: var(--text); font-family: var(--mono); font-size: 11px; font-weight: 700; }
  .dist-pct { color: var(--muted); font-size: 10px; font-family: var(--mono); }

  .sidebar-nav { border-top: 1px solid var(--border); padding-top: 16px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 24px;
    font-size: 13px; cursor: pointer; transition: all 0.15s;
    color: var(--text2); border-left: 3px solid transparent; margin: 1px 0;
  }
  .nav-item:hover { background: var(--bg2); color: var(--text); }
  .nav-item.active { background: var(--bg2); color: var(--cyan); border-left-color: var(--cyan); }
  .nav-icon { font-size: 14px; width: 20px; text-align: center; }
  .nav-badge {
    margin-left: auto; background: var(--red); color: white;
    font-size: 10px; font-weight: 700; padding: 2px 7px;
    border-radius: 10px; font-family: var(--mono);
  }

  /* ── Content area ────────────────────────── */
  .content { padding: 28px; overflow-y: auto; }

  /* ── Threat feed ─────────────────────────── */
  .feed-header {
    display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
  }
  .feed-title { font-size: 16px; font-weight: 600; font-family: var(--mono); color: var(--text); letter-spacing: 1px; }
  .feed-count {
    font-family: var(--mono); font-size: 11px; color: var(--text2);
    background: var(--bg2); border: 1px solid var(--border);
    padding: 3px 10px; border-radius: 4px;
  }
  .filter-row { margin-left: auto; display: flex; gap: 6px; }
  .filter-btn {
    font-family: var(--mono); font-size: 10px; padding: 4px 12px;
    border-radius: 4px; cursor: pointer; letter-spacing: 1px; border: 1px solid;
    transition: all 0.15s; text-transform: uppercase;
  }

  /* ── Table ───────────────────────────────── */
  .feed-table { width: 100%; border-collapse: collapse; }
  .feed-table th {
    font-family: var(--mono); font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding: 0 16px 12px; text-align: left; font-weight: 400;
    border-bottom: 1px solid var(--border);
  }
  .feed-row {
    border-bottom: 1px solid var(--border);
    animation: rowSlide 0.3s ease-out;
    cursor: default;
  }
  .feed-row:hover { background: var(--bg2); }
  @keyframes rowSlide { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }

  .feed-row td { padding: 12px 16px; font-size: 13px; vertical-align: middle; }

  .td-time { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .td-ip { font-family: var(--mono); font-size: 12px; color: var(--text); }
  .td-path { font-family: var(--mono); font-size: 11px; color: var(--text2); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .label-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    padding: 3px 10px; border-radius: 3px; letter-spacing: 1px;
    border: 1px solid; text-transform: uppercase; white-space: nowrap;
  }

  .threat-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .threat-bar-bg { flex: 1; height: 4px; background: var(--bg3); border-radius: 2px; max-width: 80px; }
  .threat-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
  .threat-pct { font-family: var(--mono); font-size: 11px; font-weight: 700; width: 32px; text-align: right; }

  .action-chip {
    font-family: var(--mono); font-size: 10px; padding: 3px 8px;
    border-radius: 3px; letter-spacing: 1px; font-weight: 700; white-space: nowrap;
  }

  /* ── Blocked IPs panel ───────────────────── */
  .blocked-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .blocked-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; position: relative; overflow: hidden;
    animation: rowSlide 0.3s ease-out;
  }
  .blocked-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--red); }
  .blocked-ip { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--red); margin-bottom: 6px; }
  .blocked-reason { font-size: 12px; color: var(--text2); margin-bottom: 10px; line-height: 1.5; }
  .blocked-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 12px; }
  .unblock-btn {
    font-family: var(--mono); font-size: 11px; padding: 5px 14px; border-radius: 4px;
    border: 1px solid var(--green); color: var(--green); background: #00E67610;
    cursor: pointer; letter-spacing: 1px; transition: all 0.15s;
  }
  .unblock-btn:hover { background: #00E67625; box-shadow: 0 0 12px #00E67630; }

  /* ── Empty state ─────────────────────────── */
  .empty {
    text-align: center; padding: 80px 40px; color: var(--muted);
    font-family: var(--mono); font-size: 13px; letter-spacing: 1px;
  }
  .empty-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.4; }
  .empty-hint { margin-top: 8px; font-size: 11px; }

  /* ── Scan line animation ─────────────────── */
  .scanline {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0; pointer-events: none; z-index: 200;
    animation: scan 4s linear infinite;
  }
  @keyframes scan {
    0% { top: 0; opacity: 0; }
    5% { opacity: 0.6; }
    95% { opacity: 0.2; }
    100% { top: 100vh; opacity: 0; }
  }

  /* ── Toast ───────────────────────────────── */
  #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; font-size: 13px; min-width: 260px;
    display: flex; align-items: center; gap: 10px;
    animation: toastIn 0.3s ease-out;
    box-shadow: 0 4px 24px #00000060;
  }
  @keyframes toastIn { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform:none; } }
  .toast.threat { border-left: 3px solid var(--red); }
  .toast.block  { border-left: 3px solid var(--orange); }
  .toast.clean  { border-left: 3px solid var(--green); }

  /* ── Scrollbar ───────────────────────────── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>
<div class="scanline"></div>
<div id="toast-container"></div>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">

const { useState, useEffect, useRef, useCallback } = React;
const API = "http://localhost:8000";

// ── Label config ─────────────────────────────────────────────
const LABELS = {
  clean:      { color: "#00E676", bg: "#00E67615", icon: "●", short: "CLEAN" },
  ddos:       { color: "#FF1744", bg: "#FF174415", icon: "▲", short: "DDoS" },
  sqli:       { color: "#FF6D00", bg: "#FF6D0015", icon: "◆", short: "SQLi" },
  suspicious: { color: "#FFD600", bg: "#FFD60015", icon: "◉", short: "SUSP" },
};

// ── Toast system ─────────────────────────────────────────────
function showToast(msg, type = "threat") {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `<span style="font-size:16px">${type==="block"?"🚫":type==="clean"?"✅":"⚠️"}</span><span>${msg}</span>`;
  document.getElementById("toast-container").appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ── Synthetic traffic simulator ───────────────────────────────
const SIM_IPS   = ["45.33.32.156","103.22.44.99","192.168.1.101","81.200.12.44","172.16.5.88","212.56.130.1"];
const SIM_PATHS = ["/api/users","/login","/admin/panel","/search","/api/orders","/api/auth","/wp-admin"];
const SIM_SCENARIOS = [
  { request_rate:5,  payload_size:400,  unique_endpoints:2, error_rate:0.01, has_sql_keywords:0, header_anomaly:0, geo_risk_score:0.08, repeated_ip:0 },
  { request_rate:920,payload_size:90,   unique_endpoints:1, error_rate:0.82, has_sql_keywords:0, header_anomaly:1, geo_risk_score:0.92, repeated_ip:1 },
  { request_rate:7,  payload_size:2600, unique_endpoints:9, error_rate:0.38, has_sql_keywords:1, header_anomaly:1, geo_risk_score:0.55, repeated_ip:0 },
  { request_rate:50, payload_size:750,  unique_endpoints:14,error_rate:0.18, has_sql_keywords:0, header_anomaly:1, geo_risk_score:0.42, repeated_ip:1 },
];

// ── MOCK classify (no backend needed) ─────────────────────────
let _mockLog = [];
let _blockedMap = {};
let _ipCounts = {};
let _totalReqs = 0;

function mockClassify(req) {
  const sc = req;
  let label = "clean", score = 0;
  if (sc.request_rate > 300)    { label = "ddos";       score = 0.7 + Math.random() * 0.28; }
  else if (sc.has_sql_keywords) { label = "sqli";       score = 0.6 + Math.random() * 0.35; }
  else if (sc.error_rate > 0.25){ label = "suspicious"; score = 0.35 + Math.random() * 0.3; }
  else                          { label = "clean";      score = Math.random() * 0.06; }

  const isBlocked = !!_blockedMap[req.ip];
  _totalReqs++;
  _ipCounts[req.ip] = (_ipCounts[req.ip] || 0) + (label !== "clean" ? 1 : 0);

  let action = "ALLOW";
  let autoBlocked = false;
  if (!isBlocked && (score > 0.85 || (_ipCounts[req.ip] >= 3 && label !== "clean"))) {
    action = "BLOCKED";
    autoBlocked = true;
    _blockedMap[req.ip] = {
      ip: req.ip,
      reason: score > 0.85 ? `High threat score: ${score.toFixed(2)} (${label.toUpperCase()})` : `Repeated threats: ${_ipCounts[req.ip]} incidents`,
      blocked_at: new Date().toISOString(),
      threat_type: label
    };
  }

  const event = {
    id: Math.random().toString(36).slice(2,10),
    timestamp: new Date().toISOString(),
    ip: req.ip, path: req.path, method: req.method,
    label, threat_score: +score.toFixed(4),
    confidence: +(0.85 + Math.random() * 0.13).toFixed(4),
    latency_ms: +(8 + Math.random() * 30).toFixed(1),
    action, auto_blocked: autoBlocked
  };

  _mockLog.unshift(event);
  if (_mockLog.length > 200) _mockLog.pop();
  return event;
}

function getMockStats() {
  const counts = { clean: 0, ddos: 0, sqli: 0, suspicious: 0 };
  _mockLog.forEach(e => counts[e.label] = (counts[e.label] || 0) + 1);
  const total = _mockLog.length || 1;
  return {
    total_requests: _totalReqs,
    blocked_ips: Object.keys(_blockedMap).length,
    threat_rate: +((total - counts.clean) / total).toFixed(4),
    label_distribution: counts,
    avg_threat_score: +(_mockLog.reduce((a, e) => a + e.threat_score, 0) / total).toFixed(4)
  };
}

// ── Components ────────────────────────────────────────────────
function LabelChip({ label }) {
  const c = LABELS[label] || LABELS.clean;
  return (
    <span className="label-chip" style={{ color: c.color, background: c.bg, borderColor: c.color + "60" }}>
      <span>{c.icon}</span> {c.short}
    </span>
  );
}

function ThreatBar({ score }) {
  const color = score > 0.7 ? "#FF1744" : score > 0.4 ? "#FFD600" : "#00E676";
  return (
    <div className="threat-bar-wrap">
      <div className="threat-bar-bg">
        <div className="threat-bar-fill" style={{ width: `${score * 100}%`, background: color }} />
      </div>
      <span className="threat-pct" style={{ color }}>{Math.round(score * 100)}%</span>
    </div>
  );
}

function StatBlock({ label, value, sub, accent, className }) {
  return (
    <div className={`stat-block ${className || accent}`}>
      <div className="stat-label">{label}</div>
      <div className={`stat-value ${accent}`}>{value}</div>
      {sub && <div className="stat-sub">{sub}</div>}
    </div>
  );
}

function DistributionBar({ dist, total }) {
  const entries = Object.entries(dist);
  return (
    <div className="dist-bar">
      <div className="dist-bar-track">
        {entries.map(([lbl, cnt]) => (
          <div key={lbl} className="dist-segment"
            style={{ width: `${(cnt / total) * 100}%`, background: LABELS[lbl]?.color || "#4A6080" }} />
        ))}
      </div>
      <div className="dist-legend">
        {entries.map(([lbl, cnt]) => (
          <div key={lbl} className="dist-row">
            <div className="dist-dot" style={{ background: LABELS[lbl]?.color || "#4A6080" }} />
            <span className="dist-name">{lbl.toUpperCase()}</span>
            <span className="dist-count">{cnt}</span>
            <span className="dist-pct">{((cnt / total) * 100).toFixed(1)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────
function App() {
  const [tab, setTab]         = useState("feed");
  const [events, setEvents]   = useState([]);
  const [blocked, setBlocked] = useState([]);
  const [stats, setStats]     = useState({ total_requests: 0, blocked_ips: 0, threat_rate: 0, label_distribution: {clean:0,ddos:0,sqli:0,suspicious:0}, avg_threat_score: 0 });
  const [simOn, setSimOn]     = useState(false);
  const [filter, setFilter]   = useState("all");
  const simRef = useRef(false);

  const refresh = useCallback(() => {
    setStats(getMockStats());
    setEvents([..._mockLog]);
    setBlocked(Object.values(_blockedMap));
  }, []);

  useEffect(() => { refresh(); }, []);

  const startSim = useCallback(async () => {
    if (simOn) { simRef.current = false; setSimOn(false); return; }
    simRef.current = true;
    setSimOn(true);
    while (simRef.current) {
      const ip   = SIM_IPS[Math.floor(Math.random() * SIM_IPS.length)];
      const path = SIM_PATHS[Math.floor(Math.random() * SIM_PATHS.length)];
      const sc   = SIM_SCENARIOS[Math.floor(Math.random() * SIM_SCENARIOS.length)];
      const evt  = mockClassify({ ip, path, method: "POST", ...sc });
      refresh();
      if (evt.auto_blocked) showToast(`Auto-blocked ${ip} — ${evt.label.toUpperCase()}`, "block");
      else if (evt.label !== "clean") showToast(`${evt.label.toUpperCase()} detected from ${ip}`, "threat");
      await new Promise(r => setTimeout(r, 700 + Math.random() * 400));
    }
    setSimOn(false);
  }, [simOn, refresh]);

  const unblock = (ip) => {
    delete _blockedMap[ip];
    delete _ipCounts[ip];
    refresh();
    showToast(`Unblocked ${ip}`, "clean");
  };

  const dist  = stats.label_distribution;
  const total = Math.max(Object.values(dist).reduce((a,b)=>a+b,0), 1);
  const filtered = filter === "all" ? events : events.filter(e => e.label === filter);
  const blockedArr = Object.values(_blockedMap);

  return (
    <div id="root" style={{ display:"flex", flexDirection:"column", minHeight:"100vh" }}>
      {/* ── Header ── */}
      <header className="header">
        <div className="logo">
          <div className="logo-icon" />
          SHIELD<span style={{color:"#fff"}}>AI</span>
        </div>
        <div className="header-divider" />
        <span className="header-subtitle">Cloud Security Intelligence Platform</span>
        <div className="header-right">
          {simOn && (
            <div className="live-badge">
              <div className="live-dot" /> LIVE MONITORING
            </div>
          )}
          <button className={`sim-btn ${simOn ? "stop" : "start"}`} onClick={startSim}>
            {simOn ? "⏹ Stop" : "▶ Simulate"}
          </button>
        </div>
      </header>

      {/* ── Main ── */}
      <div className="main" style={{flex:1}}>
        {/* ── Sidebar ── */}
        <aside className="sidebar">
          <div className="sidebar-section">
            <div className="sidebar-label">Overview</div>
            <StatBlock label="TOTAL REQUESTS" value={stats.total_requests.toLocaleString()} sub="since session start" accent="cyan" />
            <StatBlock label="AUTO-BLOCKED IPs" value={blockedArr.length} sub="active blocks" accent="red" />
            <StatBlock label="THREAT RATE" value={`${(stats.threat_rate * 100).toFixed(1)}%`} sub="of all traffic" accent="yellow" />
            <StatBlock label="AVG THREAT SCORE" value={`${(stats.avg_threat_score * 100).toFixed(1)}%`} sub="classifier output" accent="orange" />
          </div>

          <div className="sidebar-section">
            <div className="sidebar-label">Traffic Distribution</div>
            <DistributionBar dist={dist} total={total} />
          </div>

          <div className="sidebar-section sidebar-nav">
            <div className="sidebar-label">Navigation</div>
            {[
              { id:"feed",    icon:"⚡", label:"Live Feed",    badge: events.filter(e=>e.label!=="clean").length || null },
              { id:"blocked", icon:"🚫", label:"Blocked IPs",  badge: blockedArr.length || null },
            ].map(n => (
              <div key={n.id} className={`nav-item ${tab===n.id?"active":""}`} onClick={()=>setTab(n.id)}>
                <span className="nav-icon">{n.icon}</span>
                {n.label}
                {n.badge ? <span className="nav-badge">{n.badge}</span> : null}
              </div>
            ))}
          </div>
        </aside>

        {/* ── Content ── */}
        <main className="content">
          {tab === "feed" && (
            <>
              <div className="feed-header">
                <span className="feed-title">THREAT FEED</span>
                <span className="feed-count">{filtered.length} events</span>
                <div className="filter-row">
                  {["all","clean","ddos","sqli","suspicious"].map(f => {
                    const c = f === "all" ? "#4A6080" : (LABELS[f]?.color || "#4A6080");
                    const active = filter === f;
                    return (
                      <button key={f} className="filter-btn"
                        style={{
                          color: active ? (f==="all"?"#fff":c) : "#4A6080",
                          borderColor: active ? c : "#1A2D50",
                          background: active ? c + "20" : "transparent"
                        }}
                        onClick={() => setFilter(f)}>
                        {f === "all" ? "ALL" : LABELS[f]?.short}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div style={{ background:"var(--bg1)", border:"1px solid var(--border)", borderRadius:10, overflow:"hidden" }}>
                <table className="feed-table">
                  <thead>
                    <tr>
                      <th>Time</th><th>IP Address</th><th>Path</th>
                      <th>Classification</th><th>Threat Score</th>
                      <th>Latency</th><th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.length === 0 ? (
                      <tr><td colSpan="7">
                        <div className="empty">
                          <div className="empty-icon">📡</div>
                          No traffic data yet
                          <div className="empty-hint">Click ▶ Simulate to generate live traffic</div>
                        </div>
                      </td></tr>
                    ) : filtered.map(e => (
                      <tr key={e.id} className="feed-row">
                        <td className="td-time">{e.timestamp?.slice(11,19)}</td>
                        <td className="td-ip">{e.ip}</td>
                        <td className="td-path" title={e.path}>{e.path}</td>
                        <td><LabelChip label={e.label} /></td>
                        <td><ThreatBar score={e.threat_score} /></td>
                        <td style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--muted)"}}>{e.latency_ms}ms</td>
                        <td>
                          <span className="action-chip" style={{
                            color: e.action==="BLOCKED" ? "#FF1744" : "#00E676",
                            background: e.action==="BLOCKED" ? "#FF174415" : "#00E67615",
                            border: `1px solid ${e.action==="BLOCKED" ? "#FF174440" : "#00E67640"}`
                          }}>{e.action}</span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </>
          )}

          {tab === "blocked" && (
            <>
              <div className="feed-header">
                <span className="feed-title">BLOCKED IPs</span>
                <span className="feed-count">{blockedArr.length} active blocks</span>
              </div>
              {blockedArr.length === 0 ? (
                <div className="empty" style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:10}}>
                  <div className="empty-icon">🛡️</div>
                  No IPs blocked yet
                  <div className="empty-hint">Auto-block triggers when threat score {'>'} 85% or 3+ repeated threats from same IP</div>
                </div>
              ) : (
                <div className="blocked-grid">
                  {blockedArr.map(b => (
                    <div key={b.ip} className="blocked-card">
                      <div className="blocked-ip">🚫 {b.ip}</div>
                      <div className="blocked-reason">{b.reason}</div>
                      <div className="blocked-meta">
                        Blocked: {b.blocked_at?.slice(0,19).replace("T"," ")}
                        &nbsp;·&nbsp;
                        Type: <span style={{color: LABELS[b.threat_type]?.color || "#FF1744"}}>{b.threat_type?.toUpperCase()}</span>
                      </div>
                      <button className="unblock-btn" onClick={() => unblock(b.ip)}>✓ Unblock IP</button>
                    </div>
                  ))}
                </div>
              )}
            </>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
